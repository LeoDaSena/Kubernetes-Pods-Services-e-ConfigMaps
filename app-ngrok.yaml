apiVersion: v1
kind: ConfigMap
metadata:
  name: ngrok-demo-html
  namespace: demo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Kubernetes + ngrok</title>
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
          color: #e2e8f0;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .container {
          text-align: center;
          max-width: 700px;
          padding: 40px;
        }
        .logo {
          font-size: 72px;
          margin-bottom: 20px;
        }
        h1 {
          font-size: 2.5rem;
          background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 12px;
        }
        .subtitle {
          font-size: 1.2rem;
          color: #94a3b8;
          margin-bottom: 40px;
        }
        .cards {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 16px;
          margin-bottom: 40px;
        }
        .card {
          background: rgba(255,255,255,0.05);
          border: 1px solid rgba(255,255,255,0.1);
          border-radius: 12px;
          padding: 24px;
          transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
          transform: translateY(-2px);
          border-color: #38bdf8;
        }
        .card-icon { font-size: 32px; margin-bottom: 8px; }
        .card-title { font-size: 1rem; font-weight: 600; color: #f1f5f9; }
        .card-desc { font-size: 0.85rem; color: #d4d4d8; margin-top: 4px; }
        .info-box {
          background: rgba(56, 189, 248, 0.1);
          border: 1px solid rgba(56, 189, 248, 0.3);
          border-radius: 12px;
          padding: 20px;
          margin-bottom: 24px;
        }
        .info-box code {
          background: rgba(0,0,0,0.3);
          padding: 2px 8px;
          border-radius: 4px;
          font-size: 0.9rem;
          color: #38bdf8;
        }
        .path-list {
          display: flex;
          justify-content: center;
          margin-top: 12px;
          flex-wrap: wrap;
          gap: 12px;
        }
        .path-badge {
          background: rgba(129, 140, 248, 0.15);
          border: 1px solid rgba(129, 140, 248, 0.3);
          padding: 6px 14px;
          border-radius: 20px;
          font-size: 0.9rem;
          font-family: monospace;
          color: #a5