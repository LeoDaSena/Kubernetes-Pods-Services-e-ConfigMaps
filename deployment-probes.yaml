apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-com-probes
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-com-probes
  template:
    metadata:
      labels:
        app: app-com-probes
    spec:
      containers:
      - name: app
        image: nginx:1.27
        ports:
        - containerPort: 80
        # Liveness: Está vivo?
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        # Readiness: Pode receber tráfego?
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        # Resources (boa prática)
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi