apiVersion: v1
kind: Pod
metadata:
  name: pod-con-config
spec:
  containers:
  - name: app
    image: alpine:3.18
    command: ['sleep', '3600']
    # ConfigMap como env vars
    envFrom:
    - configMapRef:
        name: app-config
    # Secret como env vars individuais
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: username
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: password