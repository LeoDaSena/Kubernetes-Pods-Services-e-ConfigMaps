# ServiceAccount "dev-sa" - identidade para pods no namespace dev
# ServiceAccounts permitem que pods se autentiquem na API do Kubernetes
# Quando um pod usa este ServiceAccount, ele herda as permissões
# definidas pelos RoleBindings/ClusterRoleBindings associados
apiVersion: v1
kind: ServiceAccount
metadata:
  # Nome do ServiceAccount - será referenciado no RoleBinding e no Pod
  name: dev-sa
  # Namespace onde o ServiceAccount existe
  namespace: dev
  labels:
    app: dev-tools